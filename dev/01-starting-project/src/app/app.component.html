<app-header></app-header>
<main>
  <ul id="users">
    <li *ngFor="let user of users; let i = index">
      <app-user
        [user]="user"
        [selected]="user.id === selectedUserId"
        (select)="onSelectUser($event)">
      </app-user>
    </li>
  </ul>

  <app-tasks *ngIf="selectedUser" [name]="selectedUser.name" [userId]="selectedUser.id"></app-tasks>
</main>
