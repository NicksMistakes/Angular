<app-header />
<main>
  <ul id="users">
    @for (item of user; track $index) {
      <li>
        <app-user [user]="item" [selected]="user.id === selectedUserId" (select)="onSelectUser($event)" />
      </li>
    }
  </ul>
  @if (selectedUser) {
   <app-tasks [id]="selectedUser.id" [name]="selectedUser.name" [userId]="selectedUser.id"/>
  }
</main>
